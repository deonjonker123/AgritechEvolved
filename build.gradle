plugins {
    id 'eclipse'
    id 'idea'
    id 'java'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[7.0,8)'
    id 'net.minecraftforge.renamer' version '1.1.8+'
}

version = mod_version
group = mod_group_id
base.archivesName = mod_id

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

def mixinSrgToOfficial = layout.buildDirectory.file(
        'mappings/srg-to-official.srg'
)

sourceSets.main.resources {
    srcDir 'src/generated/resources'
    exclude '.cache'
}

minecraft {
    mappings channel: mapping_channel, version: mapping_version

    runs {
        configureEach {
            workingDir.convention layout.projectDirectory.dir('run')

            systemProperty 'mixin.env.remapRefMap', 'true'
            systemProperty 'mixin.env.refMapRemappingFile', mixinSrgToOfficial.get().asFile.absolutePath
        }

        register('client') {
            systemProperty 'forge.enabledGameTestNamespaces', mod_id
        }

        register('server') {
            systemProperty 'forge.enabledGameTestNamespaces', mod_id
            args '--nogui'
        }

        register('gameTestServer') {
            systemProperty 'forge.enabledGameTestNamespaces', mod_id
        }

        register('data') {
            workingDir = layout.projectDirectory.dir('run-data')
            args '--mod', mod_id, '--all', '--output', layout.projectDirectory.dir('src/generated/resources'), '--existing', layout.projectDirectory.dir('src/main/resources')
        }
    }
}

repositories {
    minecraft.mavenizer(it)
    maven fg.forgeMaven
    maven fg.minecraftLibsMaven
    maven {
        name = "Jared's maven"
        url = 'https://maven.blamejared.com/'
        content {
            includeGroup 'mezz.jei'
            includeGroup 'net.mezzdev.config'
        }
    }
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
        content {
            includeGroup 'maven.modrinth'
        }
    }
}

dependencies {
    implementation minecraft.dependency("net.minecraftforge:forge:$minecraft_version-$forge_version")
    compileOnly renamer.dependency("mezz.jei:jei-${minecraft_version}-common-api:${jei_version}")
    compileOnly renamer.dependency("mezz.jei:jei-${minecraft_version}-forge-api:${jei_version}")
    runtimeOnly renamer.dependency("mezz.jei:jei-${minecraft_version}-forge:${jei_version}")
    compileOnly renamer.dependency("net.mezzdev.config:mezz_config-${minecraft_version}-config-api:${mezz_config_version}")
    runtimeOnly renamer.dependency("net.mezzdev.config:mezz_config-${minecraft_version}-forge:${mezz_config_version}")
    implementation renamer.dependency("maven.modrinth:jade:${project.jade_version}")
}

tasks.named('processResources', ProcessResources) {
    var replaceProperties = [
            minecraft_version: minecraft_version, minecraft_version_range: minecraft_version_range,
            forge_version: forge_version, forge_version_range: forge_version_range,
            loader_version_range: loader_version_range,
            mod_id: mod_id, mod_name: mod_name, mod_license: mod_license, mod_version: mod_version,
            mod_authors: mod_authors, mod_description: mod_description,
    ]
    inputs.property('replaceProperties', replaceProperties)

    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties
    }
}

tasks.named('jar', Jar) {
    manifest {
        attributes([
                'Specification-Title': mod_id,
                'Specification-Vendor': mod_authors,
                'Specification-Version': '1',
                'Implementation-Title': project.name,
                'Implementation-Version': project.jar.archiveVersion,
                'Implementation-Vendor': mod_authors
        ])
    }
    archiveClassifier = 'unobfuscated'
}

renamer.mappings.from minecraft.dependency.toSrgFile

def officialToSrgMappings = minecraft.dependency.toSrgFile

tasks.register('generateMixinSrgToOfficial') {
    inputs.file(officialToSrgMappings)
    outputs.file(mixinSrgToOfficial)

    doLast {
        def classMappings = [:]
        def memberMappings = []

        def currentOfficialClass = null
        def currentSrgClass = null

        def inputFile = officialToSrgMappings.get()

        new java.util.zip.GZIPInputStream(
                inputFile.newInputStream()
        ).withReader('UTF-8') { reader ->

            reader.eachLine { rawLine ->
                if (!rawLine.trim() || rawLine.startsWith('tsrg2')) {
                    return
                }

                def parts = rawLine.trim().split(/\s+/)

                if (!rawLine.startsWith(' ') &&
                        !rawLine.startsWith('\t')) {

                    if (parts.length == 2 &&
                            !parts[0].endsWith('/') &&
                            !parts[1].endsWith('/')) {

                        currentOfficialClass = parts[0]
                        currentSrgClass = parts[1]

                        classMappings[currentOfficialClass] =
                                currentSrgClass
                    }

                    return
                }

                if (parts.length != 3 ||
                        currentOfficialClass == null) {
                    return
                }

                def officialName = parts[0]
                def descriptor = parts[1]
                def srgName = parts[2]

                if (descriptor.startsWith('(')) {
                    def srgDescriptor = descriptor.replaceAll(
                            /L([^;]+);/
                    ) { match, className ->
                        "L${classMappings.get(className) ?: className};"
                    }

                    memberMappings << [
                            type: 'MD',
                            srgOwner: currentSrgClass,
                            srgName: srgName,
                            srgDescriptor: srgDescriptor,
                            officialOwner: currentOfficialClass,
                            officialName: officialName,
                            officialDescriptor: descriptor
                    ]
                }
                else {
                    memberMappings << [
                            type: 'FD',
                            srgOwner: currentSrgClass,
                            srgName: srgName,
                            officialOwner: currentOfficialClass,
                            officialName: officialName
                    ]
                }
            }
        }

        def outputFile = mixinSrgToOfficial.get().asFile
        outputFile.parentFile.mkdirs()

        outputFile.withWriter('UTF-8') { writer ->

            classMappings.each { officialName, srgName ->
                writer.println("CL: ${srgName} ${officialName}")
            }

            memberMappings.each { mapping ->
                if (mapping.type == 'MD') {
                    writer.println(
                            "MD: ${mapping.srgOwner}/${mapping.srgName} " +
                                    "${mapping.srgDescriptor} " +
                                    "${mapping.officialOwner}/${mapping.officialName} " +
                                    "${mapping.officialDescriptor}"
                    )
                } else {
                    writer.println(
                            "FD: ${mapping.srgOwner}/${mapping.srgName} " +
                                    "${mapping.officialOwner}/${mapping.officialName}"
                    )
                }
            }
        }

        println "Generated Mixin mappings: ${outputFile.absolutePath}"
        println "Class mappings: ${classMappings.size()}"
        println "Member mappings: ${memberMappings.size()}"
    }
}

tasks.matching {
    it.name in [
            'runClient',
            'runServer',
            'runGameTestServer',
            'runData'
    ]
}.configureEach {
    dependsOn tasks.named('generateMixinSrgToOfficial')
}

renamer.classes(tasks.named('jar', Jar)) {
    archiveClassifier = ''
}

publishing {
    repositories {
        maven { url = layout.projectDirectory.dir('repo').asFile.toURI() }
    }

    publications.register('mavenJava', MavenPublication) {
        from components.java
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

idea.module { downloadJavadoc = downloadSources = true }